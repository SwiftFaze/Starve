name: Close linked issues

# Feature PRs merge into `develop`, not the default branch (`master`), so
# GitHub's own "Closes #N" auto-close never fires for them. This does it —
# automating Step 7.5 of .claude/workflow.md.

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Passed via env, never interpolated into the script body — a PR
          # description is untrusted input.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issues="$(printf '%s' "$PR_BODY" \
            | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' \
            | sort -un || true)"

          if [[ -z "$issues" ]]; then
            echo "No 'Closes #N' reference found in PR #$PR_NUMBER body; nothing to close."
            exit 0
          fi

          for n in $issues; do
            state="$(gh issue view "$n" --repo "$REPO" --json state --jq .state 2>/dev/null || echo MISSING)"
            case "$state" in
              OPEN)
                echo "Closing #$n (linked from PR #$PR_NUMBER)"
                gh issue close "$n" --repo "$REPO" --reason completed \
                  --comment "Closed automatically: merged in #$PR_NUMBER."
                ;;
              CLOSED)  echo "#$n already closed; skipping." ;;
              *)       echo "::warning::#$n could not be read (not an issue in $REPO?); skipping." ;;
            esac
          done
