services:
  starve:
    build: .
    ports:
      - "8080:8080"
    environment:
      STARVE_DB_PATH: /data/starve.db
    volumes:
      - starve-data:/data
    healthcheck:
      # The JRE image is not guaranteed to ship curl or wget; bash's /dev/tcp always works.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  starve-data:
