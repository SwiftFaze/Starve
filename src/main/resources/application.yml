server:
  forward-headers-strategy: native
  mime-mappings:
    webmanifest: application/manifest+json
  tomcat:
    # A redirect names only the path, so the browser keeps the scheme it is on even when a TLS proxy's
    # X-Forwarded-Proto is missing or untrusted (an absolute http:// one is blocked as mixed content).
    use-relative-redirects: true

starve:
  db:
    path: ./data/starve.db

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1088KB
