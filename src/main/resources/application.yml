server:
  forward-headers-strategy: native

starve:
  db:
    path: ./data/starve.db

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1088KB
