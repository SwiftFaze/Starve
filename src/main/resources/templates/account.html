<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account - Starve</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon-dark.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/starve.css">
  <link rel="preload" href="/fonts/akira-expanded.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/htmx.min.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <p class="wordmark"><a href="/feed" hx-get="/feed" data-switch hx-target="#shell" hx-select="#shell" hx-select-oob="#bar" hx-swap="outerHTML" hx-push-url="true">Starve</a></p>
    <nav class="pages" aria-label="Pages">
      <a class="tab" href="/feed" hx-get="/feed" data-switch hx-target="#shell" hx-select="#shell" hx-select-oob="#bar" hx-swap="outerHTML" hx-push-url="true">Timeline</a>
      <a class="tab" href="/sources" hx-get="/sources" data-switch hx-target="#shell" hx-select="#shell" hx-select-oob="#bar" hx-swap="outerHTML" hx-push-url="true">Sources</a>
    </nav>
    <th:block th:with="onAccount=true"><th:block th:replace="~{bar-actions :: bar-actions}"></th:block></th:block>
  </header>

  <div class="label" id="shell">
    <aside class="sleeve" aria-label="Account">
      <div class="series-block">
        <h1 class="series roster-name">Account</h1>
        <button type="button" class="theme-switch" aria-label="Switch theme"></button>
      </div>
    </aside>

    <main class="sheet access" id="sheet">
      <form class="access-form" method="post" th:action="@{/account/password}">
        <div class="sheet-head">
          <h2 class="sheet-title">Change password</h2>
        </div>

        <p id="message" class="message" role="status" th:if="${changed}">Password changed</p>
        <p id="message" class="message" role="alert" th:if="${message}" th:text="${message}">Current password is incorrect</p>

        <label class="field-label" for="current-password">Current password</label>
        <input class="field" id="current-password" type="password" name="currentPassword"
               autocomplete="current-password" required>

        <label class="field-label" for="new-password">New password</label>
        <input class="field" id="new-password" type="password" name="newPassword" autocomplete="new-password"
               aria-describedby="password-hint" required>
        <p class="hint" id="password-hint">At least 10 characters</p>

        <button type="submit" class="primary">Change password</button>
      </form>

      <dl class="access-notes">
        <div><dt>Signed in as</dt><dd th:text="${username}">rob</dd></div>
        <div><dt>Other devices</dt><dd>Changing the password signs out every browser that was remembered.</dd></div>
        <div><dt>Forgotten it?</dt><dd>An admin can set a temporary password for you from Settings.</dd></div>
      </dl>
    </main>
  </div>
</body>
</html>
