<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- The top bar's account actions: the Account link, the Settings link (admins only) and the sign-out button, the
     current page marked ("onAccount" / "onSettings"). Sign-out is a plain POST form, so it works without JavaScript and
     inside every swapped bar. -->
<th:block th:fragment="bar-actions">
<!-- On phones, with scripts, the actions fold behind this menu button (deck.js, "Phone chrome"). -->
<button type="button" class="bar-menu" aria-expanded="false" aria-controls="bar-actions" aria-label="Menu"><svg
    class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12v1.5H2zM2 7.25h12v1.5H2zM2 10.5h12V12H2z"/></svg></button>
<div class="bar-actions" id="bar-actions">
  <a class="tab account-link" href="/account" hx-get="/account" data-switch hx-target="#shell" hx-select="#shell" hx-select-oob="#bar" hx-swap="outerHTML" hx-push-url="true" th:attr="aria-current=${onAccount} ? 'page'">Account</a>
  <a class="tab settings-link" href="/settings" hx-get="/settings" data-switch hx-target="#shell" hx-select="#shell" hx-select-oob="#bar" hx-swap="outerHTML" hx-push-url="true" th:if="${admin}"
     th:attr="aria-current=${onSettings} ? 'page'">Settings</a>
  <form class="signout" method="post" th:action="@{/logout}">
    <button type="submit" aria-label="Sign out" title="Sign out">Sign out</button>
  </form>
</div>
</th:block>
</body>
</html>
