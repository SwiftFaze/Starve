<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete user - Starve</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon-dark.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/starve.css">
</head>
<body>
  <header class="bar" id="bar">
    <p class="wordmark"><a href="/feed">Starve</a></p>
    <nav class="pages" aria-label="Pages">
      <a class="tab" href="/feed">Timeline</a>
      <a class="tab" href="/sources">Sources</a>
    </nav>
    <th:block th:with="onSettings=true"><th:block th:replace="~{bar-actions :: bar-actions}"></th:block></th:block>
  </header>

  <div class="label">
    <aside class="sleeve" aria-label="Delete user">
      <div class="series-block">
        <h1 class="series roster-name">Delete</h1>
        <button type="button" class="theme-switch" aria-label="Switch theme"></button>
      </div>
    </aside>

    <main class="sheet access" id="sheet">
      <form class="access-form" method="post" th:action="@{/settings/users/{id}/delete(id=${id})}">
        <div class="sheet-head">
          <h2 class="sheet-title">Delete <span th:text="${username}">friend</span>?</h2>
        </div>
        <p class="sheet-note">The account <strong th:text="${username}">friend</strong> and all their sources, groups
          and items will be permanently deleted. This cannot be undone.</p>
        <div class="confirm-actions">
          <button type="submit" class="danger">Delete permanently</button>
          <a class="read-toggle" href="/settings">Cancel</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
