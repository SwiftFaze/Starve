<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete user - Starve</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon-dark.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/starve.css">
  <script src="/htmx.min.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <p class="wordmark"><a href="/feed">Starve</a></p>
    <nav class="pages" aria-label="Pages">
      <a class="tab" href="/feed">Timeline</a>
      <a class="tab" href="/sources">Sources</a>
    </nav>
    <th:block th:replace="~{bar-actions :: bar-actions}"></th:block>
  </header>

  <div class="label">
    <aside class="sleeve" aria-label="Delete user">
      <div class="series-block">
        <h1 class="series roster-name">Delete user</h1>
        <button type="button" class="theme-switch" aria-label="Switch theme"></button>
      </div>

      <form class="add" method="post" th:action="@{/settings/users/{id}/delete(id=${id})}">
        <p class="hint">Delete <strong th:text="${username}">friend</strong>?</p>
        <div class="field-row">
          <button type="submit">Delete permanently</button>
          <a class="read-toggle" href="/settings">Cancel</a>
        </div>
      </form>
    </aside>

    <main class="sheet" id="sheet">
      <p class="sheet-note">
        The account <strong th:text="${username}">friend</strong> and all their sources, groups and items will be
        permanently deleted. This cannot be undone.
      </p>
    </main>
  </div>
</body>
</html>
