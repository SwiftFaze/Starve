<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete user - Starve</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon-dark.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0c0c12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ebe8e0" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Starve">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/starve.css">
  <link rel="preload" href="/fonts/akira-expanded.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/htmx.min.js"></script>
  <script src="/deck.js" defer></script>
</head>
<body>
  <header th:replace="~{app-bar :: app-bar('settings')}"></header>

  <div class="label" id="shell">
    <aside class="sleeve" aria-label="Delete user">
      <div class="series-block">
        <h1 class="series roster-name">Delete</h1>
        <button type="button" class="theme-switch" aria-label="Switch theme"></button>
      </div>
    </aside>

    <main class="sheet access" id="sheet">
      <form class="access-form" method="post" th:action="@{/settings/users/{id}/delete(id=${id})}">
        <div class="sheet-head">
          <h2 class="sheet-title">Delete <span th:text="${username}">friend</span>?</h2>
        </div>
        <p class="sheet-note">The account <strong th:text="${username}">friend</strong> and all their sources, groups
          and items will be permanently deleted. This cannot be undone.</p>
        <div class="confirm-actions">
          <button type="submit" class="danger">Delete permanently</button>
          <a class="read-toggle" href="/settings" hx-get="/settings" data-switch hx-target="#shell" hx-select="#shell" hx-select-oob="#bar" hx-swap="outerHTML" hx-push-url="true">Cancel</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
