<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${appName}">Starve</title>
  <link rel="stylesheet" href="/starve.css">
  <script src="/htmx.min.js"></script>
  <script>
    // The dock outlives every swap of the sheet, so the playing row is re-marked after each one.
    function markPlaying() {
      var player = document.querySelector('#dock .player');
      document.querySelectorAll('.item.playing').forEach(function (row) {
        row.classList.remove('playing');
        var play = row.querySelector('.play');
        if (play) { play.textContent = 'Play'; play.setAttribute('aria-pressed', 'false'); }
      });
      if (!player) return;
      var row = document.querySelector('.item[data-item="' + player.dataset.item + '"]');
      if (!row) return;
      row.classList.add('playing');
      var play = row.querySelector('.play');
      if (play) { play.textContent = 'Playing'; play.setAttribute('aria-pressed', 'true'); }
    }

    // Stop removes the focused button, so focus goes back to the row it was playing.
    function stopPlayer(button) {
      var target = document.querySelector('.item.playing .play') || document.getElementById('sheet');
      button.closest('.player').remove();
      markPlaying();
      target.focus();
    }

    // The phone dock is a fixed bar, so the page keeps that much room free below the sheet; the
    // sleeve sticks below the bar, whose height grows when the group tabs wrap.
    function trackHeights() {
      if (!window.ResizeObserver) return;
      var observer = new ResizeObserver(function () {
        var dock = document.getElementById('dock');
        var bar = document.getElementById('bar');
        if (dock) document.body.style.setProperty('--dock-h', dock.offsetHeight + 'px');
        if (bar) document.body.style.setProperty('--bar-h', bar.offsetHeight + 'px');
      });
      observer.observe(document.body);
      var dock = document.getElementById('dock');
      if (dock) observer.observe(dock);
    }

    document.addEventListener('htmx:afterSettle', markPlaying);
    document.addEventListener('DOMContentLoaded', trackHeights);
  </script>
</head>
<body>
  <header class="bar" id="bar">
    <h1 class="wordmark"><a href="/" th:text="${appName}">Starve</a></h1>
    <nav class="pages" aria-label="Pages">
      <a class="tab" href="/" aria-current="page">Timeline</a>
      <a class="tab" href="/sources">Sources</a>
    </nav>
    <nav class="groups" aria-label="Groups">
      <a class="group-link" th:each="entry : ${nav}" th:href="${entry.href}" th:text="${entry.label}"
         th:attr="aria-current=${entry.current} ? 'page',hx-get=${entry.href}"
         hx-target="#sheet" hx-select="#sheet" hx-select-oob="#bar,#series" hx-swap="outerHTML"
         hx-push-url="true">All</a>
    </nav>
  </header>

  <div class="label">
    <aside class="sleeve" aria-label="Series and player">
      <div id="series" class="series-block">
        <h2 class="series" th:text="${series.name}">All</h2>
        <p class="series-meta">
          <th:block th:text="|${series.unread} unread|">9 unread</th:block>
          <span th:text="${showAll} ? 'Read included, newest first' : 'Newest first'">Newest first</span>
          <span class="range" th:unless="${#lists.isEmpty(items)}" th:with="ids=${#lists.sort(items.![id])}"
                th:text="|STV ${#numbers.formatInteger(ids[0], 4)}–${#numbers.formatInteger(ids[#lists.size(ids) - 1], 4)}|">STV 0131–0155</span>
        </p>
      </div>
      <section id="dock" class="dock" aria-label="Now playing" aria-live="polite"></section>
    </aside>

    <main class="sheet" id="sheet" tabindex="-1">
      <div class="sheet-head">
        <h2 class="sheet-title" th:text="${showAll} ? 'All releases' : 'New releases'">New releases</h2>
        <div class="view-actions" th:if="${hasSources}">
          <a class="read-toggle" th:href="${toggleHref}" th:attr="hx-get=${toggleHref}"
             hx-target="#sheet" hx-select="#sheet" hx-select-oob="#bar,#series" hx-swap="outerHTML"
             hx-push-url="true" th:text="${showAll} ? 'Hide read' : 'Show read'">Show read</a>
          <form method="post" action="/read-all" hx-post="/read-all"
                hx-target="#sheet" hx-select="#sheet" hx-select-oob="#bar,#series" hx-swap="outerHTML">
            <input type="hidden" name="before" th:value="${renderedAt}">
            <input type="hidden" name="group" th:if="${groupId}" th:value="${groupId}">
            <button type="submit">Mark all read</button>
          </form>
        </div>
      </div>

      <p class="sheet-note" th:unless="${hasSources}">No sources yet. <a href="/sources">Add a source</a> to start your catalogue.</p>

      <div id="timeline" th:if="${hasSources}">
        <th:block th:fragment="more">
          <article th:each="item : ${items}" th:class="${item.read} ? 'item read' : 'item'"
                   th:attr="data-title=${item.title},data-item=${item.catalogueNumber}">
            <span class="cat" th:text="${item.catalogueNumber}">STV 0132</span>
            <img class="thumb" th:if="${item.thumbnailUrl}" th:src="${item.thumbnailUrl}" alt="" loading="lazy">
            <span class="blank" th:unless="${item.thumbnailUrl}"></span>
            <div class="body">
              <a class="title" th:href="@{/items/{id}/open(id=${item.id})}" th:text="${item.title}">Title</a>
              <span class="source" th:text="${item.sourceTitle}">Source</span>
            </div>
            <time class="date" th:datetime="${item.publishedIso}" th:text="${item.published}">date</time>
            <div class="actions">
              <button type="button" class="play" th:if="${item.playable}"
                      th:attr="hx-get=@{/items/{id}/player(id=${item.id})}"
                      hx-target="#dock" hx-swap="innerHTML"
                      hx-trigger="click[!target.closest('.playing')]" aria-pressed="false">Play</button>
              <form th:unless="${item.read}" method="post" th:action="@{/items/{id}/read(id=${item.id})}"
                    th:attr="hx-post=@{/items/{id}/read(id=${item.id})}" hx-target="closest article" hx-swap="outerHTML">
                <button type="submit">Mark read</button>
              </form>
            </div>
          </article>
          <a th:if="${moreHref}" class="load-more" th:href="${moreHref}"
             th:attr="hx-get=${moreHref}" hx-swap="outerHTML">Load more</a>
          <p th:unless="${moreHref}" class="caught-up">You're all caught up</p>
        </th:block>
      </div>
    </main>
  </div>
</body>
</html>
