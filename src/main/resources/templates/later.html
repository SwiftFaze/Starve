<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- One save-for-later (clock) toggle from the model attribute "laterToggle"; the form posts the reverse toggle, without JavaScript too. -->
<th:block th:fragment="toggle">
  <form method="post" class="later" th:id="${laterToggle.domId}" th:action="${laterToggle.action}" hx-swap="outerHTML"
        th:attr="hx-post=${laterToggle.action},hx-target=${'#' + laterToggle.domId},hx-swap-oob=${laterToggle.oob} ? 'true' : null,data-later=${laterToggle.saved ? 'true' : 'false'}">
    <button type="submit" class="toggle" th:classappend="${laterToggle.saved} ? 'saved'"
            th:attr="aria-pressed=${laterToggle.saved ? 'true' : 'false'},aria-label=${laterToggle.saved} ? 'Remove from Later' : 'Save for later'"><svg
      class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zm0 1.5a5 5 0 1 0 0 10A5 5 0 0 0 8 3zm.75 1.75V7.7l2.4 1.4-.75 1.3-3.15-1.85V4.75z"/></svg></button>
  </form>
</th:block>

<!-- The pane's toggle ("laterToggle") and the timeline row's toggle ("rowLater"), answered together to an htmx toggle. -->
<th:block th:fragment="pair">
  <th:block th:replace="~{::toggle}"></th:block>
  <th:block th:with="laterToggle=${rowLater}"><th:block th:replace="~{::toggle}"></th:block></th:block>
</th:block>
</body>
</html>
