<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Starve</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/starve.css">
  <script src="/htmx.min.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <p class="wordmark"><a href="/">Starve</a></p>
  </header>

  <div class="label">
    <aside class="sleeve" aria-label="Sign in">
      <div class="series-block">
        <h1 class="series roster-name">Sign in</h1>
        <button type="button" class="theme-switch" aria-label="Switch theme"></button>
      </div>

      <p id="message" class="message" role="status" th:if="${message}" th:text="${message}">Invalid username or password</p>

      <form class="add" method="post" th:action="@{/login}">
        <label class="field-label" for="username">Username</label>
        <div class="field-row">
          <input class="field" id="username" type="text" name="username" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required>
        </div>
        <label class="field-label" for="password">Password</label>
        <div class="field-row">
          <input class="field" id="password" type="password" name="password" autocomplete="current-password" required>
          <button type="submit">Sign in</button>
        </div>
        <p class="hint"><label><input type="checkbox" name="remember-me"> Remember me for 30 days</label></p>
      </form>
    </aside>

    <main class="sheet" id="sheet">
      <p class="sheet-note">Sign in with the account set up on this instance.</p>
      <a class="read-toggle" href="/signup" th:if="${signupsOpen}">Sign up</a>
    </main>
  </div>
</body>
</html>
