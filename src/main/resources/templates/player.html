<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
<div class="player" th:attr="data-item=${item.catalogueNumber}">
  <div class="now">
    <img class="now-art" th:if="${item.thumbnailUrl}" th:src="${item.thumbnailUrl}" alt="">
    <span class="now-art now-blank" th:unless="${item.thumbnailUrl}" aria-hidden="true"
          th:text="${item.catalogueNumber}">STV 0132</span>
    <div class="now-text">
      <span class="now-cat" th:text="${item.catalogueNumber}">STV 0132</span>
      <span class="now-title" th:text="${item.title}">Title</span>
      <span class="now-source" th:text="${item.sourceTitle}">Source</span>
    </div>
  </div>
  <div class="ratio-16x9" th:if="${kind == 'youtube'}">
    <iframe th:src="${embedUrl}" title="YouTube video player"
            allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </div>
  <iframe th:if="${kind == 'soundcloud'}" th:src="${embedUrl}" title="SoundCloud player" height="166"
          scrolling="no" allow="autoplay"></iframe>
  <div class="player-off" th:if="${kind == 'disabled'}">
    <p>This video can't be played here</p>
    <a th:href="${watchUrl}" rel="noopener noreferrer">Watch on YouTube</a>
  </div>
  <button type="button" class="stop" hx-on:click="stopPlayer(this)">Stop</button>
</div>
</th:block>
</body>
</html>
