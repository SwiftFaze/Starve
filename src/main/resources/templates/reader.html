<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
<article class="reader-view" th:attr="data-item=${post.catalogueNumber}">
  <header class="reader-head">
    <button type="button" class="reader-close" hx-on:click="closeReader(this)">Close</button>
    <span class="reader-cat"><th:block th:text="${post.catalogueNumber}">STV 0132</th:block><span
        class="read-tag" title="Opening a post marks it read">Read</span></span>
    <div class="reader-toggles">
      <th:block th:replace="~{star :: star}"></th:block>
      <th:block th:replace="~{later :: toggle}"></th:block>
      <a class="toggle feed-link" th:if="${post.feedUrl}" th:href="${post.feedUrl}" target="_blank"
         rel="noopener noreferrer" th:attr="aria-label=|Open the feed of ${post.sourceTitle}|"
         title="Open the source's feed"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path
          d="M2 2.5a11.5 11.5 0 0 1 11.5 11.5h-2A9.5 9.5 0 0 0 2 4.5zm0 4.25A7.25 7.25 0 0 1 9.25 14h-2A5.25 5.25 0 0 0 2 8.75zM2 11h3v3H2z"/></svg></a>
      <button type="button" class="toggle center-toggle" aria-pressed="false" aria-label="Centre the post"
              title="Centre the post"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path
          d="M2 3h12v1.5H2zM4 6.25h8v1.5H4zM2 9.5h12V11H2zM4 12.75h8v1.5H4z"/></svg></button>
    </div>
    <h2 class="reader-title" th:text="${post.title}">Title</h2>
    <p class="reader-meta">
      <img class="site-icon" th:if="${post.siteIcon}" th:src="${post.siteIcon}" alt="" loading="lazy">
      <span class="source" th:text="${post.sourceTitle}">Source</span>
      <time class="date" th:datetime="${post.publishedIso}" th:text="${post.published}">date</time>
    </p>
    <a class="reader-original" th:if="${post.link}" th:href="${post.link}" target="_blank"
       rel="noopener noreferrer">Open original</a>
  </header>
  <img class="reader-image" th:if="${post.headerImage}" th:src="${post.headerImage}" alt="" loading="lazy">
  <div class="reader-body" th:if="${post.body}" th:utext="${post.body}"></div>
  <p class="reader-empty" th:unless="${post.body}">This post has no text to show here.<th:block
     th:if="${post.link}"> Open the original to read it.</th:block></p>
</article>
</th:block>
</body>
</html>
