<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - Starve</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon-dark.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/starve.css">
  <script src="/htmx.min.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <p class="wordmark"><a href="/feed">Starve</a></p>
    <nav class="pages" aria-label="Pages">
      <a class="tab" href="/feed">Timeline</a>
      <a class="tab" href="/sources">Sources</a>
    </nav>
    <th:block th:replace="~{bar-actions :: bar-actions}"></th:block>
  </header>

  <div class="label">
    <aside class="sleeve" aria-label="Settings">
      <div class="series-block">
        <h1 class="series roster-name">Settings</h1>
        <button type="button" class="theme-switch" aria-label="Switch theme"></button>
      </div>

      <form class="add" method="post" th:action="@{/settings/signups}">
        <input type="hidden" name="allow" th:value="${!signupsOn}">
        <span class="field-label" id="signups-label">Allow new signups</span>
        <div class="field-row">
          <button type="submit" role="switch" aria-labelledby="signups-label" th:attr="aria-checked=${signupsOn}"
                  th:text="${signupsOn} ? 'On' : 'Off'">Off</button>
        </div>
        <p class="hint">While on, anyone who can reach this instance can create a regular account at /signup.</p>
      </form>
    </aside>

    <main class="sheet" id="sheet">
      <p class="message" id="notice" role="status" th:if="${notice}" th:text="${notice}">Deleted user friend</p>
      <h2 class="sheet-title">Users</h2>
      <ul id="user-list" class="roster">
        <li class="user" th:each="user : ${users}" th:attr="data-username=${user.username}">
          <div class="body">
            <strong class="name" th:text="${user.username}">rob</strong>
            <span class="badge" th:if="${user.admin}">Admin</span>
            <span class="you" th:if="${user.you}">(you)</span>
          </div>
          <span class="created">Created <time th:datetime="${user.created}" th:text="${user.created}">2026-10-12</time></span>
          <div class="actions" th:unless="${user.you}">
            <form method="post" th:action="@{/settings/users/{id}/reset(id=${user.id})}">
              <button type="submit">Reset password</button>
            </form>
            <a class="read-toggle" th:href="@{/settings/users/{id}/delete(id=${user.id})}">Delete</a>
          </div>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
