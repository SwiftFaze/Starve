<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporary password - Starve</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon-dark.svg">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/starve.css">
  <script src="/htmx.min.js"></script>
</head>
<body>
  <header class="bar" id="bar">
    <p class="wordmark"><a href="/feed">Starve</a></p>
    <nav class="pages" aria-label="Pages">
      <a class="tab" href="/feed">Timeline</a>
      <a class="tab" href="/sources">Sources</a>
    </nav>
    <th:block th:replace="~{bar-actions :: bar-actions}"></th:block>
  </header>

  <div class="label">
    <aside class="sleeve" aria-label="Temporary password">
      <div class="series-block">
        <h1 class="series roster-name">Temporary password</h1>
        <button type="button" class="theme-switch" aria-label="Switch theme"></button>
      </div>

      <p class="hint">New password for <strong th:text="${username}">friend</strong></p>
      <p class="message" role="status"><code id="temporary-password" th:text="${temporaryPassword}">K7QM-2XNP-W4RD-9HTC</code></p>
      <p class="hint">It is shown once and is not stored anywhere readable. Give it to <span th:text="${username}">friend</span>,
        who can change it on their Account page after signing in.</p>
    </aside>

    <main class="sheet" id="sheet">
      <a class="read-toggle" href="/settings">Back to Settings</a>
    </main>
  </div>
</body>
</html>
