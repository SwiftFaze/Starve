<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporary password - Starve</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/favicon-dark.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0c0c12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ebe8e0" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Starve">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/starve.css">
  <link rel="preload" href="/fonts/akira-expanded.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/martian-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/htmx.min.js"></script>
  <script src="/deck.js" defer></script>
</head>
<body>
  <header th:replace="~{app-bar :: app-bar('settings')}"></header>

  <div class="label" id="shell">
    <aside class="sleeve" aria-label="Temporary password">
      <div class="series-block">
        <h1 class="series roster-name">Password</h1>
        <button type="button" class="theme-switch" aria-label="Switch theme"></button>
      </div>
    </aside>

    <main class="sheet access" id="sheet">
      <div class="access-form">
        <div class="sheet-head">
          <h2 class="sheet-title">Temporary password</h2>
        </div>
        <p class="sheet-note">New password for <strong th:text="${username}">friend</strong></p>
        <p class="temporary"><code id="temporary-password" th:text="${temporaryPassword}">K7QM-2XNP-W4RD-9HTC</code></p>
        <p class="hint">It is shown once and is not stored anywhere readable. Give it to <span th:text="${username}">friend</span>,
          who can change it on their Account page after signing in.</p>
        <a class="read-toggle filled" href="/settings" hx-get="/settings" data-switch hx-target="#shell" hx-select="#shell" hx-select-oob="#bar" hx-swap="outerHTML" hx-push-url="true">Back to Settings</a>
      </div>
    </main>
  </div>
</body>
</html>
